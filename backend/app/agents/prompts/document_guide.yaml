  [출력 형식]
  반드시 아래 JSON 형식으로만 응답하세요. 다른 텍스트는 포함하지 마세요.
  {{
    "program_name": "프로그램명",
    "documents": [
      {{
        "doc_name": "서류명 (한국어)",
        "issuer": "발급처 (한국어)",
        "description": "간단한 설명 (한국어)",
